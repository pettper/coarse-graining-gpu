[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "coarse-graining-gpu"
version = "0.1.0"
description = "A small GPU-accelerated coarse graining library"
requires-python = ">=3.11"
dependencies = ["jax[cuda13]", "numpy", "scipy", "warp-lang"]

[tool.setuptools]
packages = [
    "coarse_graining_gpu",
    "coarse_graining_gpu.src",
    "coarse_graining_gpu.src.utils",
]

[tool.setuptools.package-dir]
coarse_graining_gpu = "."
"coarse_graining_gpu.src" = "src"
"coarse_graining_gpu.src.utils" = "src/utils"
